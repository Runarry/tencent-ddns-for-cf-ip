provider:
  # web: 抓取公开网页 https://api.uouin.com/cloudflare.html，不需要站长工具 API 账号。
  # api: 使用收费 API，需要 username/key。
  source: "web"
  url: "https://api.uouin.com/cloudflare.html"
  web_url: "https://api.uouin.com/cloudflare.html"
  api_url: "https://api.uouin.com/app/cloudflare"
  username: ""
  key: ""
  nodeids: ["ctcc", "bgp", "cucc"]
  timeout: "20s"
  custom:
    enabled: false
    # 容器内路径；Windows 桌面文件需要在 docker-compose.yml 中挂载到这个路径。
    result_csv: "/data/result.csv"
    top_n: 5

dnspod:
  secret_id: "your-tencent-secret-id"
  secret_key: "your-tencent-secret-key"
  domain: ""
  record_line: "默认"
  ttl: 600

sync:
  interval: "10m"
  managed_prefix: "cf"
  managed_base_subdomain: "cdn"
  # 站长工具请求仍使用 ctcc，DNS 主机名可映射为你想要的标签。
  node_labels:
    ctcc: "ctcc"
  # 默认域名 cdn.q.example.com 使用当前最快的电信节点更新。
  default_nodeid: "ctcc"
  max_records_per_node: 5
  ping_timeout: "3s"
  ping_threshold_ms: 800
  ping_concurrency: 32
  ping_packets: 3
  speed_test:
    enabled: false
    # 启用后填写一个走 Cloudflare 的真实 HTTPS 业务 URL。
    url: "https://your-cf-domain.example.com/probe.bin"
    download_bytes: 1048576
    timeout: "8s"
    concurrency: 8
    # 默认会自动使用 max_records_per_node * 3。
    candidates_per_node: 15
  fallback:
    enabled: true
    wildcard_subdomain: "*.cdn"
    target: ""
    type: "CNAME"

api:
  listen_addr: ":8080"
  bearer_token: "replace-with-a-long-random-token"

subscriptions:
  # 公开订阅地址为 /sub/<public_token>?key=<key>，无需 Bearer Token，请使用足够长的随机值。
  # mode 为 rewrite 时使用优选域名改写分享；mode 为 merge 时只合并分享，不使用优选。
  # nodeids 为空时使用全部优选域名；填写后只使用匹配线路的优选域名。
  # 请求可追加 nodeids=ctcc,bgp 动态收窄线路范围。
  - id: "ctcc-main"
    name: "ctcc-main"
    enabled: false
    public_token: "replace-with-a-long-random-subscription-token"
    key: "replace-with-a-long-random-subscription-key"
    format: "base64"
    mode: "rewrite"
    nodeids: ["ctcc"]
    # mode 属于整个订阅；sources 可混合直接分享和 HTTP(S) 远程订阅。
    sources:
      - id: "direct-main"
        name: "直接分享"
        type: "share"
        enabled: true
        share: "vless://replace-with-uuid@origin.example.com:443?security=tls#example"
      - id: "remote-main"
        name: "远程订阅"
        type: "remote"
        enabled: true
        url: "https://subscription.example.com/list"
    # 旧 shares: [] 格式仍然兼容；新配置建议使用 sources。

subscription_sources:
  # 远程源响应可为 Base64 或 UTF-8 明文，均按非空行导入。
  refresh_interval: "15m"
  timeout: "10s"
  max_response_bytes: 2097152
  max_lines: 10000
  max_redirects: 5

state:
  state_file: "/data/state.json"
  # 运行时订阅和静态 YAML 订阅的 Web 编辑覆盖层。
  subscriptions_file: "/data/subscriptions.json"
  # 远程订阅源最后一次成功内容；刷新失败时继续使用。
  subscription_cache_file: "/data/subscription-cache.json"
